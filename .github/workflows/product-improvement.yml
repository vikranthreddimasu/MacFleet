name: product-improvement-planning

on:
  schedule:
    # GitHub cron uses UTC. Run at both possible 3:00 AM America/New_York
    # offsets, then gate inside the job so daylight saving time stays correct.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-improvement-planning
  cancel-in-progress: false

jobs:
  audit:
    name: Generate improvement audit
    runs-on: ubuntu-latest
    steps:
      - name: Confirm local 3 AM schedule window
        id: local-time
        if: github.event_name == 'schedule'
        run: |
          if [ "$(TZ=America/New_York date +%H)" != "03" ]; then
            echo "Skipping because it is not 3 AM in America/New_York."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.local-time.outputs.should_run == 'true'
        with:
          fetch-depth: 40
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.local-time.outputs.should_run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        if: github.event_name != 'schedule' || steps.local-time.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run low-risk validation checks
        if: github.event_name != 'schedule' || steps.local-time.outputs.should_run == 'true'
        run: |
          ruff check macfleet/ tests/
          python -m pytest tests/test_security tests/test_utils tests/test_cli -q
      - name: Build product-improvement report
        if: github.event_name != 'schedule' || steps.local-time.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# MacFleet product-improvement audit"
            echo
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Base ref: ${GITHUB_SHA}"
            echo
            echo "## Recent commits"
            git log --oneline -10
            echo
            echo "## TODO/FIXME inventory"
            rg -n "TODO|FIXME|XXX|HACK" macfleet tests docs README.md TODOS.md || true
            echo
            echo "## Security-sensitive references"
            rg -n "token|secret|password|credential|auth|authorize|permission|TLS|HMAC" macfleet/security macfleet/compute tests/test_security tests/test_compute docs/reference/security.md README.md || true
            echo
            echo "## Suggested next action"
            echo "Use docs/automation/product-improvement-workflow.md to select one high-impact, reviewable improvement from this audit, create a human-named branch from master, test it, and open a focused PR."
          } > product-improvement-report.md
      - name: Upload improvement report
        if: github.event_name != 'schedule' || steps.local-time.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: product-improvement-report
          path: product-improvement-report.md
          if-no-files-found: error
